name: Build Nomi Uploader for macOS
on:
  workflow_dispatch:
  push:
    paths:
      - 'uploader/gui/**'
      - 'uploader/nomi-uploader.py'
      - 'uploader/legacy_v085.py'
      - '.github/workflows/build-nomi-uploader-macos.yml'
concurrency:
  group: nomi-uploader-macos-alpha
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify uploader planning
        run: python -m unittest discover -s uploader/gui -p test_export_prompts.py -v
      - name: Build macOS app
        run: bash uploader/gui/build-macos.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: NomiUploader-macOS-${{ matrix.arch }}
          path: dist/NomiUploader-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NomiUploader-macOS-*
          path: dist
          merge-multiple: true
      - name: Publish macOS alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "This run is superseded; skipping release update."
            exit 0
          fi
          tag=nomi-uploader-macos-alpha
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/NomiUploader-macOS-arm64.zip dist/NomiUploader-macOS-x86_64.zip --clobber
            gh release edit "$tag" --notes-file uploader/gui/README-MACOS.md --prerelease
          else
            gh release create "$tag" dist/NomiUploader-macOS-arm64.zip dist/NomiUploader-macOS-x86_64.zip --title "Nomi Uploader macOS Alpha" --prerelease --target "${{ github.sha }}" --notes-file uploader/gui/README-MACOS.md
          fi
