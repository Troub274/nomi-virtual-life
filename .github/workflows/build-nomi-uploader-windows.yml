name: Build Nomi Uploader for Windows
# Alpha build trigger: automatically publish latest main commit.
on:
  workflow_dispatch:
  push:
    paths:
      - 'uploader/gui/**'
      - 'uploader/nomi-uploader.py'
      - 'uploader/legacy_v085.py'
      - '.github/workflows/build-nomi-uploader-windows.yml'
concurrency:
  group: nomi-uploader-windows-alpha
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ZIP/JSON prompt planning
        shell: pwsh
        run: python -m unittest discover -s uploader/gui -p test_export_prompts.py -v
      - name: Full uploader regression gate
        run: python -m unittest discover -s uploader/tests -p 'test_*.py' -v
      - name: Package Windows executable
        shell: pwsh
        run: ./uploader/gui/build-windows.ps1
      - name: Publish Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NomiUploader-Windows
          path: dist/NomiUploader.exe
          if-no-files-found: error

      - name: Prepare user download ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/NomiUploader.exe -DestinationPath dist/NomiUploader-Windows.zip -Force
          Get-FileHash dist/NomiUploader.exe -Algorithm SHA256 | Format-List
      - name: Publish Windows alpha pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw "Could not verify current main commit; refusing to publish." }
          if ($latest.Trim() -ne "${{ github.sha }}") {
            Write-Host "This build is from an older commit. Skipping release publication to protect the latest ZIP."
            exit 0
          }
          $tag = "nomi-uploader-windows-alpha"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/NomiUploader-Windows.zip --repo ${{ github.repository }} --title "Nomi Uploader Windows Alpha" --prerelease --target ${{ github.sha }} --notes-file uploader/gui/WINDOWS-ALPHA.md
          } else {
            gh release upload $tag dist/NomiUploader-Windows.zip --repo ${{ github.repository }} --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not replace alpha ZIP on GitHub Release." }
            gh release edit $tag --repo ${{ github.repository }} --notes-file uploader/gui/WINDOWS-ALPHA.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publish failed." }
