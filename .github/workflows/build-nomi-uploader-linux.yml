name: Build Nomi Uploader for Linux
on:
  workflow_dispatch:
  push:
    paths:
      - 'uploader/gui/**'
      - 'uploader/nomi-uploader.py'
      - 'uploader/legacy_v085.py'
      - '.github/workflows/build-nomi-uploader-linux.yml'
concurrency:
  group: nomi-uploader-linux-alpha
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKitGTK development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 gir1.2-gtk-3.0 python3-gi python3-venv
      - name: Use Ubuntu Python with system GObject bindings
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv-linux
          echo "$GITHUB_WORKSPACE/.venv-linux/bin" >> "$GITHUB_PATH"
      - name: Verify upload planning
        run: python -m unittest discover -s uploader/gui -p test_export_prompts.py -v
      - name: Package Linux binary
        run: bash uploader/gui/build-linux.sh
      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NomiUploader-Linux-x86_64
          path: dist/NomiUploader-Linux-x86_64.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NomiUploader-Linux-x86_64
          path: dist
      - name: Publish Linux alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/NomiUploader-Linux-x86_64.tar.gz
          tag=nomi-uploader-linux-alpha
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/NomiUploader-Linux-x86_64.tar.gz --repo "${{ github.repository }}" --clobber
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file uploader/gui/README-LINUX.md --prerelease
          else
            gh release create "$tag" dist/NomiUploader-Linux-x86_64.tar.gz --repo "${{ github.repository }}" --title "Nomi Uploader Linux Alpha" --prerelease --target "${{ github.sha }}" --notes-file uploader/gui/README-LINUX.md
          fi
