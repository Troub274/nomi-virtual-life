name: Release Nomi Uploader (unified)
on:
  workflow_dispatch:
  push:
    paths:
      - 'uploader/**'
      - '.github/workflows/release-nomi-uploader-unified.yml'
concurrency:
  group: nomi-uploader-unified
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r uploader/requirements.txt
      - run: python -m unittest discover -s uploader/gui -p test_export_prompts.py -v
      - run: python -m unittest discover -s uploader/tests -p 'test_*.py' -v
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./uploader/gui/build-windows.ps1
        shell: pwsh
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows-package/cli | Out-Null
          Copy-Item dist/NomiUploader.exe dist/windows-package/
          Copy-Item uploader/nomi-uploader.py,uploader/legacy_v085.py,uploader/requirements.txt,uploader/README.md,uploader/RECOVERY.md dist/windows-package/cli/
          Copy-Item uploader/gui/CLI-IN-GUI-DOWNLOAD.md dist/windows-package/
          Compress-Archive -Path dist/windows-package/* -DestinationPath dist/NomiUploader-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: uploader-windows
          path: dist/NomiUploader-Windows.zip
  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 gir1.2-gtk-3.0 python3-gi python3-venv
      - run: |
          /usr/bin/python3 -m venv --system-site-packages .venv-linux
          echo "$GITHUB_WORKSPACE/.venv-linux/bin" >> "$GITHUB_PATH"
      - run: bash uploader/gui/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uploader-linux
          path: dist/NomiUploader-Linux-x86_64.tar.gz
  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash uploader/gui/build-macos.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: uploader-macos-${{ matrix.arch }}
          path: dist/NomiUploader-macOS-${{ matrix.arch }}.zip
  cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist/cli
          cp uploader/nomi-uploader.py uploader/legacy_v085.py uploader/requirements.txt uploader/README.md uploader/RECOVERY.md dist/cli/
          cp uploader/gui/CLI-IN-GUI-DOWNLOAD.md dist/cli/
          cd dist
          zip -rq NomiUploader-Python-CLI.zip cli
      - uses: actions/upload-artifact@v4
        with:
          name: uploader-cli
          path: dist/NomiUploader-Python-CLI.zip
  publish:
    needs: [windows, linux, macos, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: uploader-*
          merge-multiple: true
          path: dist
      - name: Publish 1.3i production release with all platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "Stale build skipped: main is $latest"
            exit 0
          fi
          test -s dist/NomiUploader-Windows.zip
          test -s dist/NomiUploader-Linux-x86_64.tar.gz
          test -s dist/NomiUploader-macOS-arm64.zip
          test -s dist/NomiUploader-macOS-x86_64.zip
          test -s dist/NomiUploader-Python-CLI.zip
          tag=nomi-uploader-v1.3i
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/NomiUploader-Windows.zip dist/NomiUploader-Linux-x86_64.tar.gz dist/NomiUploader-macOS-arm64.zip dist/NomiUploader-macOS-x86_64.zip dist/NomiUploader-Python-CLI.zip --clobber
            gh release edit "$tag" --notes-file uploader/RELEASE.md
          else
            gh release create "$tag" dist/NomiUploader-Windows.zip dist/NomiUploader-Linux-x86_64.tar.gz dist/NomiUploader-macOS-arm64.zip dist/NomiUploader-macOS-x86_64.zip dist/NomiUploader-Python-CLI.zip --target "${{ github.sha }}" --title "Nomi Uploader 1.3i — Interface Release" --notes-file uploader/RELEASE.md
          fi
